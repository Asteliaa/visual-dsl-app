<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавление диаграммы</title>
</head>
<body>
    <h1>Добавить новую диаграмму</h1>
    <form action="/add?auth=1" method="POST">
        <div>
            <label for="title">Название диаграммы:</label><br>
            <input type="text" id="title" name="title" required>
        </div>
        <br>
        <div>
            <label for="dsl">Код диаграммы (DSL):</label><br>
            <textarea id="dsl" name="dsl" rows="5" required></textarea>
        </div>
        <br>
        <button type="submit">Создать</button>
    </form>
    <br>
    <a href="/">Вернуться к списку</a>
</body>
</html>
