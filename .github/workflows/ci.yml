name: CI

on:
  push:
    branches: [main, 'pz*', 'lab*', 'tests']
  pull_request:
    branches: [main, 'pz*', 'lab*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build:
    name: Frontend build (Vite)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build frontend
        run: npx vite build

      - name: Smoke test of the server
        run: |
          PORT=5050 node server.js &
          sleep 3
          curl -fsS http://localhost:5050/ > /dev/null
          curl -fsS "http://localhost:5050/logs?auth=1" > /dev/null
          curl -fsS http://localhost:5050/api/diagrams > /dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5050/no-such-page)
          test "$code" = "404"
